<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>選取工項與計算總價</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #f4f6f8; margin: 0; }
    h3 { margin-top: 0; color: #333; text-align: center; }
    .card { background: white; padding: 12px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    select, input { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    select { flex: 2; background: #fff; }
    input { flex: 1; width: 60px; text-align: center; }
    button { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn-add { background: #007bff; color: white; width: 100%; font-weight: bold; padding: 12px; margin-top: 5px; }
    .btn-send { background: #07c160; color: white; width: 100%; font-size: 16px; font-weight: bold; padding: 14px; margin-top: 15px; border-radius: 8px; }
    .btn-del { background: #ff4d4f; color: white; padding: 8px 12px; font-weight: bold; }
    .total-box { font-size: 18px; font-weight: bold; text-align: right; margin-top: 15px; color: #d9363e; padding: 10px; background: #fff; border-radius: 8px; }
  </style>
</head>
<body>

  <h3>🛠️ 工項報價選單</h3>
  <div id="items-container"></div>
  
  <button class="btn-add" onclick="addRow()">+ 新增工項</button>

  <div class="total-box">
    總價：NT$ <span id="grand-total">0</span>
  </div>

  <button class="btn-send" onclick="sendQuote()">送出報價至聊天室</button>

<script>
  const LIFF_ID = "2011171896-3wQjjkqC";
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwoWv9643o512qG0WZ6LxdAOJ6rb0CAd00068IRozPryzeXBayfDzGMSk_wkvmK-Wro/exec";

  let itemList = [];

  async function init() {
    // 1. 抓取 Google Sheet 資料
    try {
      let res = await fetch(GAS_URL);
      itemList = await res.json();
      addRow();
    } catch (e) {
      alert("讀取工項資料失敗，請確認 GAS 部署權限。");
    }

    // 2. 初始化 LIFF 並強制登入
    try {
      if (typeof liff !== 'undefined') {
        await liff.init({ liffId: LIFF_ID });
        // 若在 LINE 內開頁面但未登入，強制導向登入
        if (!liff.isLoggedIn() && liff.isInClient()) {
          liff.login();
        }
      }
    } catch (err) {
      console.log("LIFF 初始化失敗:", err);
    }
  }

  function addRow() {
    const container = document.getElementById("items-container");
    const div = document.createElement("div");
    div.className = "card row-item";

    let optionsHTML = '<option value="">--請選擇工項--</option>';
    itemList.forEach((item, index) => {
      optionsHTML += `<option value="${index}">${item.name} ($${item.price})</option>`;
    });

    div.innerHTML = `
      <div class="row">
        <select onchange="calculate()">${optionsHTML}</select>
        <input type="number" value="1" min="1" onchange="calculate()" placeholder="數量">
        <button class="btn-del" onclick="removeRow(this)">✕</button>
      </div>
      <div style="text-align:right; font-size:12px; color:#666;">
        小計：NT$ <span class="subtotal">0</span>
      </div>
    `;
    container.appendChild(div);
  }

  function removeRow(btn) {
    btn.closest('.card').remove();
    calculate();
  }

  function calculate() {
    let total = 0;
    const rows = document.querySelectorAll(".row-item");
    
    rows.forEach(row => {
      const select = row.querySelector("select");
      const qty = parseInt(row.querySelector("input").value) || 0;
      const subtotalSpan = row.querySelector(".subtotal");

      if (select.value !== "") {
        const price = itemList[select.value].price;
        const subtotal = price * qty;
        subtotalSpan.innerText = subtotal.toLocaleString();
        total += subtotal;
      } else {
        subtotalSpan.innerText = "0";
      }
    });

    document.getElementById("grand-total").innerText = total.toLocaleString();
  }

  async function sendQuote() {
    const rows = document.querySelectorAll(".row-item");
    let msg = "📋 【工項報價單】\n------------------\n";
    let total = document.getElementById("grand-total").innerText;
    let hasItem = false;

    rows.forEach(row => {
      const select = row.querySelector("select");
      const qty = row.querySelector("input").value;
      if (select.value !== "") {
        const item = itemList[select.value];
        msg += `• ${item.name} x${qty} = NT$ ${(item.price * qty).toLocaleString()}\n`;
        hasItem = true;
      }
    });

    if (!hasItem) {
      alert("請至少選擇一個工項！");
      return;
    }

    msg += `------------------\n💰 總計：NT$ ${total}`;

    // 優先嘗試直接發送至當前聊天室
    if (typeof liff !== 'undefined' && liff.isApiAvailable('sendMessages')) {
      try {
        await liff.sendMessages([{ type: 'text', text: msg }]);
        liff.closeWindow();
        return;
      } catch (err) {
        console.log("sendMessages 失敗，改用 shareTargetPicker:", err);
      }
    }

    // 備用方案：跳出 LINE 好友/聊天室選擇器供使用者選擇發送
    if (typeof liff !== 'undefined' && liff.isApiAvailable('shareTargetPicker')) {
      try {
        await liff.shareTargetPicker([{ type: 'text', text: msg }]);
        liff.closeWindow();
      } catch (err) {
        alert("傳送失敗：" + err);
      }
    } else {
      alert("目前環境無法調用 LINE 傳送功能，報價如下：\n\n" + msg);
    }
  }
