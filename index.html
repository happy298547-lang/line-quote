<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>選取工項與派工 v2.2</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js?v=2.1"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #f4f6f8; margin: 0; }
    h3 { margin-top: 0; color: #333; text-align: center; }
    .card { background: white; padding: 12px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .qty-group { display: flex; align-items: center; gap: 4px; flex: 1; }
    .unit-text { font-size: 13px; color: #555; font-weight: bold; white-space: nowrap; }
    .form-group { margin-bottom: 8px; }
    .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; font-weight: bold; }
    .input-field { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; background: #fff; }
    select, input, textarea { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    select { flex: 2; background: #fff; width: 100%; }
    input[type="number"] { width: 100%; text-align: center; }
    textarea { width: 100%; resize: vertical; box-sizing: border-box; font-family: inherit; }
    button { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn-add { background: #007bff; color: white; width: 100%; font-weight: bold; padding: 12px; margin-top: 5px; }
    .btn-send { background: #07c160; color: white; width: 100%; font-size: 16px; font-weight: bold; padding: 14px; margin-top: 15px; border-radius: 8px; }
    .btn-del { background: #ff4d4f; color: white; padding: 8px 12px; font-weight: bold; }
    .btn-date { background: #e2e8f0; color: #333; padding: 8px 12px; font-size: 12px; border-radius: 6px; }
    .total-box { font-size: 18px; font-weight: bold; text-align: right; margin-top: 15px; color: #d9363e; padding: 10px; background: #fff; border-radius: 8px; }
  </style>
</head>
<body>

  <h3>🛠️ 工程派工選單</h3>

  <div class="card">
    <div class="form-group">
      <label for="project-id">案場代號 / 名稱：</label>
      <select id="project-id" class="input-field" onchange="onProjectSelect()">
        <option value="">--請選擇案場代號--</option>
      </select>
    </div>
    <div class="form-group">
      <label for="location-name">地名 / 地點：</label>
      <input type="text" id="location-name" class="input-field" placeholder="請輸入施工地點或地名">
    </div>
    <div class="form-group" style="margin-bottom:0;">
      <label for="dispatch-date">派工單日期：</label>
      <div style="display: flex; gap: 8px; align-items: center;">
        <input type="date" id="dispatch-date" class="input-field" style="flex: 1;">
        <button type="button" class="btn-date" onclick="changeDate(-1)">昨天</button>
        <button type="button" class="btn-date" onclick="changeDate(0)">今天</button>
      </div>
    </div>
  </div>

  <div id="items-container"></div>
  
  <button class="btn-add" onclick="addRow()">+ 新增工項</button>

  <div class="card" style="margin-top: 12px;">
    <div class="form-group" style="margin-bottom: 0;">
      <label for="dispatch-note">備註說明：</label>
      <textarea id="dispatch-note" class="input-field" rows="2" placeholder="請輸入備註事項（選填）"></textarea>
    </div>
  </div>

  <div class="total-box">
    總計：NT$ <span id="grand-total">0</span>
  </div>

  <button class="btn-send" onclick="sendQuote()">送出派工單至聊天室</button>

<script>
  const LIFF_ID = "2011171896-LyV2R2Un";
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwoWv9643o512qG0WZ6LxdAOJ6rb0CAd00068IRozPryzeXBayfDzGMSk_wkvmK-Wro/exec";

  let globalData = { projects: {} };

  function changeDate(daysOffset) {
    const dateInput = document.getElementById("dispatch-date");
    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + daysOffset);
    
    const yyyy = targetDate.getFullYear();
    const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
    const dd = String(targetDate.getDate()).padStart(2, '0');
    dateInput.value = `${yyyy}-${mm}-${dd}`;
  }

  function parsePrice(priceVal) {
    if (priceVal === undefined || priceVal === null) return 0;
    const cleanStr = String(priceVal).replace(/[^0-9.-]+/g, "");
    return parseFloat(cleanStr) || 0;
  }

  function formatMoney(amount) {
    return Number(amount).toLocaleString(undefined, {
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    });
  }

  async function init() {
    changeDate(0);

    try {
      let res = await fetch(GAS_URL);
      globalData = await res.json();

      const projectSelect = document.getElementById("project-id");
      projectSelect.innerHTML = '<option value="">--請選擇案場代號--</option>';
      if (globalData.projects) {
        Object.keys(globalData.projects).forEach(pId => {
          const opt = document.createElement("option");
          opt.value = pId;
          opt.textContent = pId;
          projectSelect.appendChild(opt);
        });
      }
    } catch (e) {
      alert("讀取工項資料失敗，請確認 GAS 部署權限。");
    }

    try {
      if (typeof liff !== 'undefined') {
        await liff.init({ liffId: LIFF_ID });
      }
    } catch (err) {
      console.log("LIFF 初始化錯誤:", err);
    }
  }

  function onProjectSelect() {
    const container = document.getElementById("items-container");
    container.innerHTML = "";
    calculate();
  }

  function addRow() {
    const container = document.getElementById("items-container");
    const selectedPId = document.getElementById("project-id").value;
    
    if (!selectedPId) {
      alert("請先選擇案場代號！");
      return;
    }

    const items = globalData.projects[selectedPId] || [];
    let optionsHTML = '<option value="">--請選擇工項--</option>';
    
    items.forEach((item, index) => {
      const unitDisplay = item.unit ? ` / ${item.unit}` : '';
      optionsHTML += `<option value="${index}">${item.name} ($${item.price}${unitDisplay})</option>`;
    });

    const div = document.createElement("div");
    div.className = "card row-item";
    div.innerHTML = `
      <div class="row">
        <select onchange="updateUnit(this); calculate();">${optionsHTML}</select>
        <div class="qty-group">
          <input type="number" step="any" min="0" value="1" oninput="calculate()" onchange="calculate()" placeholder="數量">
          <span class="unit-text"></span>
        </div>
        <button class="btn-del" onclick="removeRow(this)">✕</button>
      </div>
      <div style="text-align:right; font-size:12px; color:#666; margin-top:5px;">
        小計：NT$ <span class="subtotal">0</span>
      </div>
    `;
    container.appendChild(div);
    calculate();
  }

  function updateUnit(selectElem) {
    const row = selectElem.closest('.row-item');
    const selectedPId = document.getElementById("project-id").value;
    const currentItems = globalData.projects[selectedPId] || [];
    const unitSpan = row.querySelector('.unit-text');
    
    if (selectElem.value !== "" && currentItems[selectElem.value]) {
      unitSpan.innerText = currentItems[selectElem.value].unit || "";
    } else {
      unitSpan.innerText = "";
    }
  }

  function removeRow(btn) {
    btn.closest('.card').remove();
    calculate();
  }

  function calculate() {
    let total = 0;
    const selectedPId = document.getElementById("project-id").value;
    const currentItems = globalData.projects[selectedPId] || [];
    const rows = document.querySelectorAll(".row-item");
    
    rows.forEach(row => {
      const select = row.querySelector("select");
      const qty = parseFloat(row.querySelector("input").value) || 0;
      const subtotalSpan = row.querySelector(".subtotal");

      if (select && select.value !== "" && currentItems[select.value]) {
        const item = currentItems[select.value];
        const price = parsePrice(item.price);
        const subtotal = price * qty;
        subtotalSpan.innerText = formatMoney(subtotal);
        total += subtotal;
      } else if (subtotalSpan) {
        subtotalSpan.innerText = "0";
      }
    });

    document.getElementById("grand-total").innerText = formatMoney(total);
  }

  async function sendQuote() {
    const projectId = document.getElementById("project-id").value || "未填寫";
    const locationName = document.getElementById("location-name").value.trim() || "未填寫";
    const dispatchDate = document.getElementById("dispatch-date").value || "未填寫";
    const dispatchNote = document.getElementById("dispatch-note").value.trim() || "無";

    const currentItems = globalData.projects[projectId] || [];
    const rows = document.querySelectorAll(".row-item");
    
    let msg = `📋 【派工單】\n`;
    msg += `📌 案場代號：${projectId}\n`;
    msg += `📍 施工地點：${locationName}\n`;
    msg += `📅 派工單日期：${dispatchDate}\n`;
    msg += `------------------\n`;

    let total = document.getElementById("grand-total").innerText;
    let hasItem = false;

    rows.forEach(row => {
      const select = row.querySelector("select");
      const qty = parseFloat(row.querySelector("input").value) || 0;
      if (select && select.value !== "" && currentItems[select.value]) {
        const item = currentItems[select.value];
        const price = parsePrice(item.price);
        const subtotal = price * qty;
        const unitStr = item.unit ? ` ${item.unit}` : '';
        msg += `• ${item.name} x${qty}${unitStr} = NT$ ${formatMoney(subtotal)}\n`;
        hasItem = true;
      }
    });

    if (!hasItem) {
      alert("請至少選擇一個工項！");
      return;
    }

    msg += `------------------\n`;
    msg += `📝 備註：${dispatchNote}\n`;
    msg += `💰 總計：NT$ ${total}`;

    if (typeof liff !== 'undefined') {
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      if (liff.isInClient()) {
        try {
          await liff.sendMessages([{ type: 'text', text: msg }]);
          liff.closeWindow();
          return;
        } catch (err) {
          console.log("sendMessages 失敗，改用 shareTargetPicker:", err);
        }
      }

      if (liff.isApiAvailable('shareTargetPicker')) {
        try {
          await liff.shareTargetPicker([{ type: 'text', text: msg }]);
          liff.closeWindow();
        } catch (shareErr) {
          alert("發送失敗：" + shareErr);
        }
      } else {
        alert("目前的環境不支援傳送訊息，內容如下：\n\n" + msg);
      }
    }
  }

  init();
</script>
</body>
</html>
