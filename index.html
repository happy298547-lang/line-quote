<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- 鎖定手機瀏覽器縮放，避免打字時畫面自動放大 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>工程派工選單 v2.9</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js?v=2.1"></script>
  
  <!-- 引入 Tom Select 搜尋套件 -->
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #f4f6f8; margin: 0; }
    h3 { margin-top: 0; color: #333; text-align: center; }
    .card { background: white; padding: 12px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .select-wrapper { flex: 1; min-width: 0; }
    .qty-group { display: flex; align-items: center; gap: 6px; width: 100px; flex-shrink: 0; }
    .unit-text { font-size: 14px; color: #555; font-weight: bold; white-space: nowrap; }
    .form-group { margin-bottom: 8px; }
    .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; font-weight: bold; }
    .input-field { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; box-sizing: border-box; background: #fff; }
    input[type="number"], textarea { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
    input[type="number"] { width: 100%; text-align: center; }
    textarea { width: 100%; resize: vertical; box-sizing: border-box; font-family: inherit; }
    button { padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn-add { background: #007bff; color: white; width: 100%; font-weight: bold; padding: 14px; margin-top: 5px; font-size: 16px; }
    .btn-send { background: #07c160; color: white; width: 100%; font-size: 16px; font-weight: bold; padding: 14px; margin-top: 15px; border-radius: 8px; }
    .btn-del { background: #ff4d4f; color: white; padding: 10px 14px; font-weight: bold; flex-shrink: 0; }
    .btn-date { background: #e2e8f0; color: #333; padding: 8px 12px; font-size: 12px; border-radius: 6px; }
    
    /* 放大並拉長手機版 Tom Select 顯示框，讓長工項完整呈現 */
    .ts-control { 
      border-radius: 8px !important; 
      padding: 10px 12px !important; 
      font-size: 15px !important; 
      min-height: 60px !important; 
      height: auto !important;
      align-items: flex-start !important;
    }
    .ts-dropdown { font-size: 15px !important; width: 100% !important; }
    .ts-control .item { font-size: 15px !important; white-space: normal !important; word-break: break-all; }
  </style>
</head>
<body>

  <h3>🛠️ 工程派工選單 v2.9</h3>

  <div class="card">
    <div class="form-group">
      <label for="project-id">案場代號 / 名稱：</label>
      <select id="project-id" class="input-field" onchange="onProjectSelect()">
        <option value="">--請選擇案場代號--</option>
      </select>
    </div>
    <div class="form-group">
      <label for="location-name">地名 / 地點：</label>
      <input type="text" id="location-name" class="input-field" placeholder="請輸入施工地點或地名">
    </div>
    <div class="form-group" style="margin-bottom:0;">
      <label for="dispatch-date">派工單日期：</label>
      <div style="display: flex; gap: 8px; align-items: center;">
        <input type="date" id="dispatch-date" class="input-field" style="flex: 1;">
        <button type="button" class="btn-date" onclick="changeDate(-1)">昨天</button>
        <button type="button" class="btn-date" onclick="changeDate(0)">今天</button>
      </div>
    </div>
  </div>

  <div id="items-container"></div>
  
  <button class="btn-add" onclick="addRow()">+ 新增工項</button>

  <div class="card" style="margin-top: 12px;">
    <div class="form-group" style="margin-bottom: 0;">
      <label for="dispatch-note">備註說明：</label>
      <textarea id="dispatch-note" class="input-field" rows="2" placeholder="請輸入備註事項（選填）"></textarea>
    </div>
  </div>

  <button class="btn-send" onclick="sendQuote()">送出派工單至聊天室</button>

<script>
  const LIFF_ID = "2011171896-LyV2R2Un";
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwoWv9643o512qG0WZ6LxdAOJ6rb0CAd00068IRozPryzeXBayfDzGMSk_wkvmK-Wro/exec";

  let globalData = { projects: [], projectItems: {} };

  function changeDate(daysOffset) {
    const dateInput = document.getElementById("dispatch-date");
    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + daysOffset);
    
    const yyyy = targetDate.getFullYear();
    const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
    const dd = String(targetDate.getDate()).padStart(2, '0');
    dateInput.value = `${yyyy}-${mm}-${dd}`;
  }

  async function init() {
    changeDate(0);

    const projectSelect = document.getElementById("project-id");
    projectSelect.innerHTML = '<option value="">--請選擇案場代號--</option>';

    // 1. 本地快取秒開
    const cachedProjects = localStorage.getItem("cached_projects");
    const cachedItems = localStorage.getItem("cached_project_items");
    
    if (cachedProjects) {
      try {
        globalData.projects = JSON.parse(cachedProjects);
        fillProjectSelect(globalData.projects);
      } catch (e) {
        console.log("解析本地快取案場失敗", e);
      }
    }
    if (cachedItems) {
      try {
        globalData.projectItems = JSON.parse(cachedItems);
      } catch (e) {
        console.log("解析本地快取工項失敗", e);
      }
    }

    // 2. 背景靜默同步
    try {
      let res = await fetch(GAS_URL);
      let serverData = await res.json();

      if (serverData.projects && Array.isArray(serverData.projects)) {
        const serverProjectsStr = JSON.stringify(serverData.projects);
        const serverItemsStr = JSON.stringify(serverData.projectItems || {});

        if (serverProjectsStr !== cachedProjects || serverItemsStr !== cachedItems) {
          globalData = serverData;
          localStorage.setItem("cached_projects", serverProjectsStr);
          localStorage.setItem("cached_project_items", serverItemsStr);
          fillProjectSelect(globalData.projects);
        }
      }
    } catch (e) {
      console.log("背景同步失敗，使用離線快取。", e);
    }

    try {
      if (typeof liff !== 'undefined') {
        await liff.init({ liffId: LIFF_ID });
      }
    } catch (err) {
      console.log("LIFF 初始化錯誤:", err);
    }
  }

  function fillProjectSelect(projectsArray) {
    const projectSelect = document.getElementById("project-id");
    const currentVal = projectSelect.value;
    
    projectSelect.innerHTML = '<option value="">--請選擇案場代號--</option>';
    projectsArray.forEach(pId => {
      const opt = document.createElement("option");
      opt.value = pId;
      opt.textContent = pId;
      projectSelect.appendChild(opt);
    });
    
    if (currentVal) {
      projectSelect.value = currentVal;
    }
  }

  function onProjectSelect() {
    const container = document.getElementById("items-container");
    container.innerHTML = "";
  }

  function addRow() {
    const container = document.getElementById("items-container");
    const selectedPId = document.getElementById("project-id").value;
    
    if (!selectedPId) {
      alert("請先選擇案場代號！");
      return;
    }

    const items = globalData.projectItems[selectedPId] || [];
    let optionsHTML = '<option value="">--請輸入關鍵字搜尋或選擇工項--</option>';
    
    items.forEach((item, index) => {
      const unitDisplay = item.unit ? ` (${item.unit})` : '';
      optionsHTML += `<option value="${index}">${item.name}${unitDisplay}</option>`;
    });

    const div = document.createElement("div");
    div.className = "card row-item";
    div.innerHTML = `
      <div class="row">
        <div class="select-wrapper">
          <select class="item-select">${optionsHTML}</select>
        </div>
        <div class="qty-group">
          <input type="number" step="any" min="0" value="1" placeholder="數量">
          <span class="unit-text"></span>
        </div>
        <button class="btn-del" onclick="removeRow(this)">✕</button>
      </div>
      <!-- 新增的工項專屬備註欄位 -->
      <div style="margin-top: 6px;">
        <input type="text" class="input-field row-note" placeholder="工項備註（選填，例：現場工班慣稱）" style="font-size: 14px; padding: 8px;">
      </div>
    `;
    container.appendChild(div);

    const selectElem = div.querySelector('.item-select');
    
    const ts = new TomSelect(selectElem, {
      create: false,
      placeholder: "請輸入關鍵字搜尋工項...",
      maxOptions: 100,
      onChange: function(val) {
        div.dataset.selectedIndex = val;
        updateUnit(div, val);
      }
    });

    div.tomSelectInstance = ts;
  }

  function updateUnit(rowDiv, val) {
    const selectedPId = document.getElementById("project-id").value;
    const items = globalData.projectItems[selectedPId] || [];
    const unitSpan = rowDiv.querySelector('.unit-text');
    
    if (val !== "" && val !== null && items[val]) {
      const item = items[val];
      unitSpan.innerText = item.unit || "";
    } else {
      unitSpan.innerText = "";
    }
  }

  function removeRow(btn) {
    const row = btn.closest('.card');
    if (row.tomSelectInstance) {
      row.tomSelectInstance.destroy();
    }
    row.remove();
  }

  async function sendQuote() {
    const projectId = document.getElementById("project-id").value || "未填寫";
    const locationName = document.getElementById("location-name").value.trim() || "未填寫";
    const dispatchDate = document.getElementById("dispatch-date").value || "未填寫";
    const dispatchNote = document.getElementById("dispatch-note").value.trim() || "無";

    const items = globalData.projectItems[projectId] || [];
    const rows = document.querySelectorAll(".row-item");
    
    let msg = `📋 【派工單】\n`;
    msg += `📌 案場代號：${projectId}\n`;
    msg += `📍 施工地點：${locationName}\n`;
    msg += `📅 派工單日期：${dispatchDate}\n`;
    msg += `------------------\n`;

    let hasItem = false;

    rows.forEach(row => {
      const selectedIndex = row.dataset.selectedIndex;
      const qty = parseFloat(row.querySelector(".qty-group input").value) || 0;
      const rowNote = row.querySelector(".row-note").value.trim(); // 取得該工項的獨立備註

      if (selectedIndex !== undefined && selectedIndex !== "" && items[selectedIndex]) {
        const item = items[selectedIndex];
        const unitStr = item.unit ? ` ${item.unit}` : '';
        msg += `• ${item.name} x${qty}${unitStr}`;
        if (rowNote) {
          msg += ` (備註: ${rowNote})`; // 如果有填寫工項備註，一併串入訊息中
        }
        msg += `\n`;
        hasItem = true;
      }
    });

    if (!hasItem) {
      alert("請至少選擇一個工項！");
      return;
    }

    msg += `------------------\n`;
    msg += `📝 總備註：${dispatchNote}`;

    if (typeof liff !== 'undefined') {
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      if (liff.isInClient()) {
        try {
          await liff.sendMessages([{ type: 'text', text: msg }]);
          liff.closeWindow();
          return;
        } catch (err) {
          console.log("sendMessages 失敗，改用 shareTargetPicker:", err);
        }
      }

      if (liff.isApiAvailable('shareTargetPicker')) {
        try {
          await liff.shareTargetPicker([{ type: 'text', text: msg }]);
          liff.closeWindow();
        } catch (shareErr) {
          alert("發送失敗：" + shareErr);
        }
      } else {
        alert("目前的環境不支援傳送訊息，內容如下：\n\n" + msg);
      }
    }
  }

  init();
</script>
</body>
</html>
